[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
no_match_path = "lib/**"
solc_version = "0.8.23"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[invariant]
runs = 256
depth = 128
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 2

[rpc_endpoints]
botchain = "${BOTCHAIN_RPC_URL}"
bohr = "${BOHR_RPC_URL}"

[etherscan]
botchain = { key = "${BOTSCAN_API_KEY}", url = "${BOTSCAN_VERIFIER_URL}", chain = 677 }
bohr = { key = "${BOTSCAN_API_KEY}", url = "${BOHR_VERIFIER_URL}", chain = 968 }
